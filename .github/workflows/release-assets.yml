name: Stable installer filename
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
permissions:
  contents: write
concurrency:
  group: stable-installer-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  stable-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify and publish the stable filename
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "dsh-visual-interactive-engine-${RELEASE_TAG#v}.tgz" --pattern SHA256SUMS.txt --dir dist
          node scripts/release-assets.mjs --tag "$RELEASE_TAG" --verify-published
          gh release upload "$RELEASE_TAG" dist/dsh-visual-interactive-engine.tgz dist/SHA256SUMS.txt --clobber
