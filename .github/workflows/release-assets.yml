name: Release stable installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to update
        required: true
        default: v0.29.2
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  stable-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIE_RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download the published installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VIE_RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag such as v0.29.2"
            exit 1
          fi
          mkdir -p dist
          gh release download "$VIE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "dsh-visual-interactive-engine-$version.tgz" \
            --pattern "SHA256SUMS.txt" --dir dist
      - name: Verify the installer and prepare its fixed filename
        run: node scripts/release-assets.mjs --tag "$VIE_RELEASE_TAG" --verify-published
      - name: Upload the stable filename and updated checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$VIE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            dist/dsh-visual-interactive-engine.tgz dist/SHA256SUMS.txt --clobber
